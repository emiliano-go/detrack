name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
        type: string
      target:
        description: "Commit, branch, or SHA to release"
        default: main
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: pypi-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  classify:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test
    needs: classify
    if: needs.classify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[test]"

      - run: python -m pytest tests/ -v

  publish:
    name: Publish to PyPI
    needs: [classify, build]
    if: needs.classify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/detrack
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Verify package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::warning::Release ${{ inputs.tag }} already exists, skipping creation"
          else
            gh release create "${{ inputs.tag }}" \
              --target "${{ inputs.target }}" \
              --draft \
              --generate-notes \
              --title "${{ inputs.tag }}"
          fi
          gh release upload "${{ inputs.tag }}" dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --draft=false
